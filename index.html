<script>
const Q=[
['기다리던 주말, 갑자기 하루가 통째로 비었다!','이왕 시간 생긴 거 누구 만날 사람 없나 연락해 본다.','오히려 좋아. 아무 약속 없이 온전히 내 시간을 즐긴다.','E','I'],
['처음 가는 여행지를 준비할 때 나는?','숙소, 이동 동선, 가볼 곳 정도는 미리 정해둔다.','꼭 필요한 것만 정하고 나머지는 그날 기분에 맡긴다.','J','P'],
['친구가 “오늘 회사에서 진짜 최악이었어”라고 한다.','무슨 일이 있었는지 들어보고 같이 해결 방법을 찾아본다.','얼마나 힘들었을지 공감하며 이야기를 들어준다.','T','F'],
['새로운 취미를 시작할 때 나는?','기본 방법을 하나씩 익히며 직접 해본다.','이것저것 알아보다 나만의 방식으로 응용해본다.','S','N'],
['아는 사람이 거의 없는 모임에 가게 됐다.','새로운 사람을 만날 생각에 은근히 기대된다.','재미있을 것 같지만 벌써 에너지가 필요할 것 같다.','E','I'],
['할 일이 한꺼번에 몰렸을 때 나는?','해야 할 일을 정리하고 순서를 정한다.','일단 지금 손에 잡히는 것부터 시작한다.','J','P'],
['친구가 중요한 결정을 앞두고 의견을 묻는다.','장단점과 현실적인 조건을 같이 따져본다.','어떤 선택이 친구를 더 행복하게 할지 생각해본다.','T','F'],
['새로운 기기의 설명서를 볼 때 나는?','구체적인 예시와 사용법부터 확인한다.','전체적인 원리를 이해한 뒤 세부 기능을 익힌다.','S','N'],
['정신없는 한 주가 끝난 금요일 밤, 나는?','좋아하는 사람을 만나 떠들면서 스트레스를 푼다.','혼자 조용히 쉬면서 에너지를 충전한다.','E','I'],
['내일 갑자기 하루 휴가가 생겼다.','오늘 대략 무엇을 할지 정해둔다.','내일 일어나서 그때 하고 싶은 걸 정한다.','J','P'],
['나와 정반대의 의견을 가진 사람을 만났다.','왜 그렇게 생각하는지 근거가 궁금하다.','왜 그렇게 느끼게 됐는지 그 사람의 이유가 궁금하다.','T','F'],
['새로운 장소에 다녀온 뒤 기억에 남는 것은?','음식, 풍경, 있었던 일 같은 구체적인 경험이다.','그곳의 분위기와 떠오른 생각이나 이미지다.','S','N']
];
const R={
INTJ:{plant:'올리브나무',img:'olive_tree.png',title:'조용한 전략가',catch:'서두르지 않아도 괜찮아. 나는 내가 갈 방향을 알고 있으니까.',traits:['통찰','계획','단단함'],good:'ENFP',bad:'ESFP',desc:[`올리브나무는 천천히 자라지만 시간이 흐를수록 단단한 모습을 갖춰가는 식물이에요. 당신도 올리브나무처럼 <strong>자신만의 기준과 방향을 가지고 움직이는 사람</strong>이에요. 당장의 결과보다 앞으로 어떻게 될지를 생각하며 계획하는 편이에요.`,`혼자 생각하고 판단할 시간을 중요하게 여기고, 충분히 고민한 뒤 움직여요. 복잡한 문제에서도 핵심을 찾아 <strong>자신만의 방식으로 정리하는 힘</strong>이 있어요.`,`머릿속에서 이미 여러 단계를 생각한 뒤 말하다 보니 주변이 따라가기 어려울 때도 있어요. 결론뿐 아니라 과정도 조금 나눈다면 <strong>단단함에 여유까지 더해질 거예요.</strong>`]},
INTP:{plant:'유칼립투스',img:'eucalyptus.png',title:'호기심 많은 탐구자',catch:'남들이 그냥 지나치는 것도 나는 한 번 더 궁금해.',traits:['호기심','논리','아이디어'],good:'ENTJ',bad:'ESFJ',desc:[`유칼립투스처럼 조용해 보여도 머릿속에는 생각이 끊임없이 자라나요. 익숙한 것에도 <strong>“왜?”라는 질문을 던지고 원리를 이해하려는 사람</strong>이에요.`,`관심이 생긴 분야라면 시간 가는 줄 모르고 깊게 파고들어요. 남들이 정해둔 방식보다 <strong>더 효율적이고 흥미로운 방법</strong>을 찾아내는 데 재미를 느껴요.`,`좋은 아이디어가 많지만 머릿속에만 머물 때도 있어요. 완벽한 답을 기다리기보다 작은 것부터 시작하면 <strong>생각이 훨씬 멋진 결과로 이어질 수 있어요.</strong>`]},
ENTJ:{plant:'몬스테라',img:'monstera.png',title:'대담한 통솔자',catch:'넓게 뻗어나가는 잎처럼, 내가 갈 길은 내가 만들어.',traits:['멋진 매력','성장','변화'],good:'INTP',bad:'ISFJ',desc:[`몬스테라는 커다란 잎을 힘차게 펼치며 공간을 채워가는 식물이에요. 당신도 몬스테라처럼 <strong>목표가 생기면 주저하기보다 직접 방향을 정하고 앞으로 나아가는 사람</strong>이에요. 상황을 빠르게 파악하고 계획을 세우는 데 능해서 자연스럽게 사람들을 이끄는 역할을 맡기도 해요.`,`새로운 도전도 쉽게 두려워하지 않아요. 더 좋은 방법이 보인다면 익숙한 방식에 머무르기보다 과감하게 변화를 선택하고, 어려운 일이 생겨도 <strong>“그래서 어떻게 해결하지?”</strong>를 먼저 생각하는 편이에요.`,`빠른 판단과 강한 추진력이 누군가에게는 조금 단호하게 느껴질 수도 있어요. <strong>앞으로 나아가는 힘에 다른 사람을 기다려주는 여유까지 더해진다면</strong>, 더욱 든든한 사람이 될 거예요.`]},
ENTP:{plant:'아이비',img:'ivy.png',title:'자유로운 발명가',catch:'정해진 길이 재미없다면, 다른 방향으로 자라면 되지!',traits:['재치','변화','가능성'],good:'INFJ',bad:'ISTJ',desc:[`아이비가 벽과 길을 따라 자유롭게 뻗어가듯 당신은 <strong>새로운 가능성과 다른 길을 발견하는 데 능한 사람</strong>이에요. 당연하게 여겨지는 것에도 질문을 던져요.`,`상황이 바뀌면 빠르게 다른 방법을 떠올리고, 예상하지 못한 아이디어를 연결하는 힘이 있어요. <strong>틀에 갇히지 않는 유연함</strong>이 큰 매력이에요.`,`새로운 아이디어가 계속 떠오르다 보니 마무리 전에 다음 재미로 넘어갈 때도 있어요. 한두 가지를 끝까지 이어가는 힘을 더하면 <strong>가능성을 실제 결과로 만드는 사람</strong>이 될 수 있어요.`]},
INFJ:{plant:'라벤더',img:'lavender.png',title:'조용한 조언자',catch:'조용히 머물러도, 나의 향기는 오래 남아.',traits:['통찰','공감','깊이'],good:'ENTP',bad:'ESTP',desc:[`라벤더의 은은한 향기처럼 당신은 크게 드러내지 않아도 <strong>주변에 오래 남는 따뜻함과 깊이</strong>가 있어요. 사람의 감정과 분위기를 세심하게 읽어요.`,`많은 관계보다 마음이 통하는 깊은 관계를 선호해요. 누군가의 이야기를 진심으로 듣고 <strong>그 사람 안의 가능성을 발견하는 힘</strong>이 있어요.`,`다른 사람의 마음을 먼저 살피다 자신의 감정을 뒤로 미룰 때도 있어요. 당신 자신에게도 같은 친절을 건넨다면 <strong>향기처럼 오래가는 단단함</strong>이 생길 거예요.`]},
INFP:{plant:'수국',img:'hydrangea.png',title:'감성적인 이상가',catch:'내 마음에는 생각보다 많은 색이 있어.',traits:['감성','상상','진심'],good:'ENFJ',bad:'ESTJ',desc:[`수국이 여러 색을 품듯 당신의 마음에도 <strong>다양한 감정과 풍부한 상상</strong>이 있어요. 겉으로 조용해 보여도 내면에서는 많은 이야기가 펼쳐져요.`,`무엇을 하든 나에게 어떤 의미가 있는지를 중요하게 생각해요. 좋아하는 사람과 가치에는 깊은 애정을 주고 <strong>작은 아름다움도 잘 발견하는 사람</strong>이에요.`,`작은 말 한마디를 오래 마음에 담아둘 만큼 섬세하기도 해요. 모두에게 이해받으려 애쓰기보다 <strong>나의 색을 알아주는 사람과 나답게 피어나도 충분해요.</strong>`]},
ENFJ:{plant:'제라늄',img:'geranium.png',title:'따뜻한 성장 리더',catch:'함께 있을 때 더 따뜻하게 피어나는 사람이야.',traits:['배려','응원','연결'],good:'INFP',bad:'ISTP',desc:[`제라늄처럼 당신은 사람들 사이에 <strong>따뜻한 온기를 더하는 사람</strong>이에요. 누가 소외되어 있는지 자연스럽게 알아차리고 먼저 손을 내밀어요.`,`다른 사람의 장점을 발견하고 응원하는 데 능해요. 혼자 잘되는 것보다 <strong>함께 성장하는 과정</strong>에서 큰 보람을 느껴요.`,`모두를 챙기려다 내 몫보다 많은 책임을 떠안을 때도 있어요. 가끔은 나를 위한 여백을 남겨두는 것이 <strong>더 오래 따뜻하게 피어나는 방법</strong>이에요.`]},
ENFP:{plant:'해바라기',img:'sunflower.png',title:'반짝이는 탐험가',catch:'재밌어 보이는 게 있다면, 일단 햇빛 따라 출발!',traits:['에너지','호기심','가능성'],good:'INTJ',bad:'ISTJ',desc:[`해바라기처럼 당신은 <strong>호기심과 밝은 에너지로 새로운 곳을 바라보는 사람</strong>이에요. 새로운 사람과 경험에서 금세 재미를 찾아요.`,`관심사가 다양하고 하나의 길만 고집하기보다 나만의 길을 만들어가요. 평범한 상황에서도 <strong>새로운 가능성을 발견하는 눈</strong>이 있어요.`,`처음의 뜨거운 열정이 다른 재미를 만나면 금세 이동할 때도 있어요. 정말 중요한 한두 가지에 집중해 끝까지 이어가면 <strong>당신의 빛이 더 멀리 닿을 거예요.</strong>`]},
ISTJ:{plant:'스투키',img:'sansevieria.png',title:'꾸준한 원칙주의자',catch:'눈에 띄지 않아도 괜찮아. 나는 꾸준히 내 자리를 지켜.',traits:['책임','꾸준함','신뢰'],good:'ISFJ',bad:'ENFP',desc:[`스투키처럼 당신은 화려하게 드러내기보다 <strong>맡은 자리를 꾸준히 지키는 믿음직한 사람</strong>이에요. 해야 할 일은 책임감 있게 마무리해요.`,`미리 준비하고 계획을 세우면 마음이 편해져요. 작은 부분도 놓치지 않는 꼼꼼함 덕분에 <strong>주변에서 믿고 맡길 수 있는 사람</strong>으로 보일 때가 많아요.`,`계획이 갑자기 바뀌면 스트레스를 받을 수 있어요. 가끔은 예상 밖의 변화에도 작은 여지를 남겨두면 <strong>단단함에 유연함까지 더해질 거예요.</strong>`]},
ISFJ:{plant:'동백꽃',img:'camellia.png',title:'다정한 수호자',catch:'말하지 않아도 괜찮아. 나는 오래 곁에 있어줄게.',traits:['배려','신뢰','세심함'],good:'ISTJ',bad:'ENTJ',desc:[`동백꽃처럼 당신은 <strong>소중한 사람 곁을 조용히 오래 지켜주는 사람</strong>이에요. 말보다 행동으로 마음을 보여주는 경우가 많아요.`,`사람들의 취향이나 작은 이야기를 잘 기억하고 필요한 순간에 챙겨줘요. 천천히 관계를 쌓지만 한번 마음을 주면 <strong>쉽게 변하지 않는 신뢰</strong>가 있어요.`,`상대에게 맞추다 자신의 마음을 참을 때도 있어요. 나의 필요와 감정도 소중히 표현하면 <strong>더 건강하고 오래가는 관계</strong>를 만들 수 있어요.`]},
ESTJ:{plant:'선인장',img:'cactus.png',title:'현실적인 실행가',catch:'환경 탓은 나중에. 일단 할 수 있는 것부터 해보자.',traits:['실행','현실감','결단'],good:'ESFJ',bad:'INFP',desc:[`선인장처럼 당신은 환경이 쉽지 않아도 <strong>지금 할 수 있는 일을 찾아 움직이는 현실적인 사람</strong>이에요. 문제를 보면 해결책부터 생각해요.`,`목표와 역할이 분명할수록 능력을 발휘하고 일을 실제 결과로 만드는 힘이 있어요. <strong>빠른 판단과 실행력</strong>이 큰 장점이에요.`,`해결에 집중하다 보면 상대의 감정을 지나칠 때도 있어요. 답을 주기 전에 마음을 한번 들어준다면 <strong>강한 추진력에 따뜻함까지 더해질 거예요.</strong>`]},
ESFJ:{plant:'벚꽃',img:'cherry_blossom.png',title:'사랑받는 분위기 메이커',catch:'좋은 순간은 함께할 때 더 예쁘잖아.',traits:['친화력','배려','표현'],good:'ESTJ',bad:'INTP',desc:[`벚꽃처럼 당신은 <strong>사람들과 함께할 때 더욱 밝게 피어나는 사람</strong>이에요. 주변 분위기를 빠르게 읽고 자연스럽게 어울려요.`,`기념일이나 작은 약속을 잘 기억하고 마음을 표현하는 데 익숙해요. 함께하는 사람에게 <strong>소속감과 따뜻함을 만들어주는 힘</strong>이 있어요.`,`주변 반응에 마음이 흔들릴 때도 있어요. 모든 사람을 만족시킬 필요는 없다는 걸 기억하면 <strong>당신다운 밝음이 더 편안하게 빛날 거예요.</strong>`]},
ISTP:{plant:'행운목',img:'lucky_tree.png',title:'침착한 해결사',catch:'복잡하게 생각하기보다, 직접 해보면 답이 나오잖아.',traits:['독립','침착','해결'],good:'ISFP',bad:'ENFJ',desc:[`행운목은 곧게 뻗은 줄기와 시원한 잎이 매력적인 식물이에요. 당신도 행운목처럼 <strong>자기만의 방식이 분명하고, 필요할 때는 망설이지 않고 움직이는 사람</strong>이에요. 말로 길게 설명하기보다 직접 해보고 경험하면서 답을 찾는 편이에요.`,`예상하지 못한 문제가 생겨도 비교적 침착하게 상황을 바라봐요. 정해진 방법만 고집하기보다 지금 가장 현실적인 해결책을 찾는 데 능하고, <strong>위기일수록 오히려 빛나는 현실적인 문제 해결 능력</strong>이 강점이에요.`,`혼자서도 잘 해내는 만큼 마음이나 생각을 표현하는 데에는 조금 무심할 수 있어요. <strong>가끔은 마음을 행동뿐 아니라 말로도 보여준다면 당신의 진심이 훨씬 잘 전달될 거예요.</strong>`]},
ISFP:{plant:'프리지아',img:'freesia.png',title:'감각적인 자유인',catch:'좋아하는 건, 그냥 내 방식대로 좋아하고 싶어.',traits:['감각','자유','다정함'],good:'ISTP',bad:'ESFJ',desc:[`프리지아처럼 당신은 <strong>자신만의 취향과 감각이 분명한 사람</strong>이에요. 억지로 드러내지 않아도 좋아하는 것에서 자연스럽게 개성이 보여요.`,`관계에서도 부담스럽게 가까워지기보다 자연스러운 흐름을 좋아해요. 말보다 행동으로 마음을 보여주고 <strong>일상의 작은 아름다움을 발견하는 능력</strong>이 있어요.`,`갈등을 피하려고 괜찮다고 말하며 마음을 숨길 때도 있어요. 나의 감정과 경계를 조금 더 솔직하게 표현하면 <strong>자유로움도 관계도 함께 지킬 수 있어요.</strong>`]},
ESTP:{plant:'장미',img:'rose.png',title:'대담한 모험가',catch:'망설이고 있을 시간에, 일단 해보는 거야.',traits:['대담함','순발력','매력'],good:'ESFP',bad:'INFJ',desc:[`장미처럼 당신은 존재감이 분명하고 <strong>지금 이 순간을 힘껏 살아가는 사람</strong>이에요. 고민만 하기보다 직접 부딪혀보며 답을 찾아요.`,`상황을 빠르게 읽고 예상 밖의 변화에도 능숙하게 대응해요. 사람들과 어울릴 때 자연스러운 자신감과 <strong>즉각적인 행동력</strong>이 돋보여요.`,`솔직하고 빠른 표현이 누군가에게는 조금 강하게 느껴질 수 있어요. 상대의 속도를 한번 살피면 <strong>대담한 매력이 더 오래 좋은 인상으로 남을 거예요.</strong>`]},
ESFP:{plant:'튤립',img:'tulip.png',title:'즐거운 에너지 메이커',catch:'오늘의 즐거움은 오늘 제대로 누려야 하잖아!',traits:['즐거움','표현','활력'],good:'ESTP',bad:'INTJ',desc:[`튤립처럼 당신은 <strong>주변을 밝게 만드는 생생한 에너지</strong>가 있어요. 좋은 경험을 혼자 간직하기보다 사람들과 함께 나누는 걸 좋아해요.`,`사람과 쉽게 가까워지고 평범한 하루에서도 재미를 찾아내요. 지금 이 순간을 즐기는 능력 덕분에 <strong>주변까지 기분 좋게 만드는 사람</strong>이에요.`,`눈앞의 즐거움에 집중하다 미래 준비를 미룰 때도 있어요. 작은 계획 하나만 더해도 <strong>오늘의 행복과 내일의 안정감을 함께 챙길 수 있어요.</strong>`]}}
const matchCopy={INTJ:'새로운 가능성과 활력을 가져오는 해바라기와, 방향과 중심을 잡아주는 올리브나무는 서로의 빈틈을 자연스럽게 채워줘요.',INTP:'유칼립투스의 독특한 아이디어를 몬스테라가 실행으로 연결해주는 조합이에요. 서로의 능력을 존중하면 멋진 결과가 생겨요.',ENTJ:'유칼립투스는 새로운 관점과 아이디어를 더하고, 몬스테라는 그것을 실제 행동으로 옮겨요. 생각과 실행이 잘 맞는 든든한 조합이에요.',ENTP:'빠르게 뻗는 아이비의 아이디어에 라벤더의 깊이와 의미가 더해져요. 서로 다른 시선이 대화를 더 풍성하게 만들어요.',INFJ:'아이비의 자유로운 아이디어가 라벤더의 깊은 통찰과 만나 새로운 가능성을 만들어요. 서로에게 신선한 자극이 되는 친구예요.',INFP:'수국의 섬세한 마음을 제라늄이 따뜻하게 알아봐줘요. 서로의 가능성을 응원하며 편안하게 성장할 수 있어요.',ENFJ:'제라늄의 응원과 수국의 진심이 잘 통하는 조합이에요. 서로의 마음을 존중하며 함께 성장하기 좋아요.',ENFP:'해바라기의 새로운 에너지와 올리브나무의 단단한 방향감이 서로를 보완해줘요. 함께하면 아이디어가 현실적인 길을 찾아요.',ISTJ:'스투키와 동백꽃은 모두 신뢰와 꾸준함을 중요하게 생각해요. 말이 많지 않아도 오래 편안하게 곁을 지킬 수 있어요.',ISFJ:'동백꽃의 세심함과 스투키의 책임감이 만나 안정적인 관계를 만들어요. 서로 믿고 의지하기 좋은 친구예요.',ESTJ:'선인장의 실행력과 벚꽃의 관계 감각이 잘 어울려요. 목표도 챙기고 사람도 챙기는 균형 좋은 조합이에요.',ESFJ:'벚꽃의 따뜻한 분위기와 선인장의 든든한 실행력이 만나 서로를 안정적으로 받쳐줘요.',ISTP:'행운목과 프리지아는 서로의 독립성과 자유를 존중해요. 부담 없이 각자의 시간을 지키면서도 필요할 때 자연스럽게 곁에 있어줘요.',ISFP:'프리지아와 행운목은 말이 많지 않아도 서로의 자유를 존중하는 편안한 관계예요. 함께 있을 때 부담이 적어요.',ESTP:'장미와 튤립은 둘 다 지금의 경험을 즐길 줄 알아요. 함께하면 행동이 빠르고 즐거운 추억이 많이 생겨요.',ESFP:'튤립과 장미는 에너지와 행동 속도가 잘 맞아요. 서로의 즐거움을 키워주는 활기찬 친구가 될 수 있어요.'};
const badCopy={INTJ:'튤립은 현재의 즐거움과 즉흥적인 경험을 중요하게 생각해요. 장기적인 계획을 선호하는 올리브나무와는 속도가 다를 수 있어요.',INTP:'벚꽃은 관계 속의 표현과 교류를 중요하게 생각해요. 혼자 생각할 시간이 필요한 유칼립투스와는 에너지 사용 방식이 달라요.',ENTJ:'동백꽃은 충분히 살피고 관계를 고려한 뒤 움직이는 편이에요. 빠르게 결정하는 몬스테라와는 서로의 속도를 이해할 시간이 필요해요.',ENTP:'스투키는 검증된 방법과 안정적인 흐름을 좋아해요. 계속 새로운 변화를 시도하는 아이비와는 방식이 다를 수 있어요.',INFJ:'장미는 먼저 행동하며 경험 속에서 답을 찾는 편이에요. 충분히 생각하고 의미를 살피는 라벤더와는 속도가 다를 수 있어요.',INFP:'선인장은 현실적인 해결책과 빠른 결정을 중시해요. 감정과 의미를 충분히 살피는 수국과는 대화 방식이 다를 수 있어요.',ENFJ:'행운목은 독립적으로 움직이고 감정을 행동으로 표현하는 편이에요. 관계와 표현을 중요하게 여기는 제라늄과는 필요한 연결의 양이 달라요.',ENFP:'스투키는 안정적인 계획을 좋아하는 반면 해바라기는 자유롭게 움직이는 걸 좋아해요. 서로의 방식을 존중하는 연습이 필요해요.',ISTJ:'해바라기의 즉흥성과 빠른 변화는 스투키에게 조금 정신없게 느껴질 수 있어요. 계획과 자유 사이의 조율이 필요해요.',ISFJ:'몬스테라의 빠른 결정과 강한 추진력이 동백꽃에게는 조금 급하게 느껴질 수 있어요. 서로의 속도를 확인하는 것이 중요해요.',ESTJ:'수국은 감정과 가치의 의미를 충분히 살피는 편이에요. 해결책부터 찾는 선인장과는 대화의 출발점이 다를 수 있어요.',ESFJ:'유칼립투스는 혼자 생각하고 충전하는 시간이 중요해요. 자주 표현하고 연결되길 원하는 벚꽃과는 관계의 리듬이 다를 수 있어요.',ISTP:'제라늄은 마음을 자주 표현하고 관계의 연결을 확인하는 편이에요. 독립적인 행운목에게는 그 정도가 부담스럽게 느껴질 수 있어요.',ISFP:'벚꽃은 활발한 교류와 표현을 좋아해요. 자연스러운 거리감을 원하는 프리지아와는 원하는 친밀감의 방식이 다를 수 있어요.',ESTP:'라벤더는 충분히 생각하고 의미를 살핀 뒤 움직여요. 행동부터 시작하는 장미와는 의사결정 속도가 다를 수 있어요.',ESFP:'올리브나무는 먼 미래까지 생각하며 계획하는 편이에요. 오늘의 즐거움을 중시하는 튤립과는 우선순위가 다를 수 있어요.'};
let idx=0, scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0},history=[];
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0)}
function startQuiz(){idx=0;scores={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};history=[];show('quiz');renderQ()}
function renderQ(){let q=Q[idx];qnum.textContent=idx+1;prog.style.width=((idx+1)/Q.length*100)+'%';qtitle.textContent=q[0];answers.innerHTML=`<button class="answer" onclick="choose(0)"><span class="letter">A</span><span class="atext">${q[1]}</span></button><button class="answer" onclick="choose(1)"><span class="letter">B</span><span class="atext">${q[2]}</span></button>`}
function choose(n){let q=Q[idx],key=q[n+3];scores[key]++;history.push(key);idx++;if(idx<Q.length)renderQ();else analyze()}
function prevQ(){if(idx===0){goStart();return}idx--;let k=history.pop();scores[k]--;renderQ()}
function analyze(){show('loading');pct.textContent='0%';loadnote.textContent='당신과 닮은 식물을 찾고 있어요...';let bar=document.querySelector('.loadbar i');bar.style.animation='none';void bar.offsetWidth;bar.style.animation='load 5s linear forwards';let t=0;let timer=setInterval(()=>{t++;pct.textContent=Math.min(100,t*2)+'%';if(t===20)loadnote.textContent='당신의 성향을 살펴보는 중이에요...';if(t===38)loadnote.textContent='당신과 닮은 식물을 찾았어요!';if(t>=50){clearInterval(timer);renderResult()}},100)}
function mbti(){return (scores.E>scores.I?'E':'I')+(scores.S>scores.N?'S':'N')+(scores.T>scores.F?'T':'F')+(scores.J>scores.P?'J':'P')}
function renderResult(){let m=mbti(),r=R[m],g=R[r.good],b=R[r.bad];resultContent.innerHTML=`<div class="result-head"><div class="result-bubble">당신과 닮은 식물은?</div><div class="plant-name">${r.plant}</div><div class="mbti-pill">${m} · ${r.title}</div><img class="result-img" src="assets/characters/${r.img}"><div class="traits">${r.traits.map(x=>`<span>${x}</span>`).join('')}</div><div class="quote">“${r.catch}”</div></div><div class="section-card"><div class="section-title">🌱 ${r.plant}는 이런 식물이에요!</div>${r.desc.map(x=>`<p>${x}</p>`).join('')}</div><div class="section-title" style="margin-top:20px">💗 잘 맞는 식물 친구</div><div class="match good"><img src="assets/characters/${g.img}"><div><h3>${g.plant} · ${r.good}</h3><p>${matchCopy[m]}</p></div></div><div class="section-title" style="margin-top:20px">☁️ 조금 어려운 식물 친구</div><div class="match bad"><img src="assets/characters/${b.img}"><div><h3>${b.plant} · ${r.bad}</h3><p>${badCopy[m]}</p></div></div><div class="actions"><button class="share" onclick="shareResult('${m}','${r.plant}')">💬 결과 공유하기</button><button class="restart" onclick="startQuiz()">↻ 다시 테스트하기</button></div><div class="section-card"><div class="section-title">🌿 다른 결과도 궁금하다면?</div><div class="alltypes">${Object.entries(R).map(([k,v])=>`<div class="type"><img src="assets/characters/${v.img}">${v.plant}<br>${k}</div>`).join('')}</div></div>`;show('result')}
async function shareResult(m,p){let text=`나의 식물 MBTI는 ${p} (${m})! 🌱`;if(navigator.share){try{await navigator.share({title:'식물 MBTI 테스트',text});return}catch(e){}}try{await navigator.clipboard.writeText(text);alert('결과 문구를 복사했어요!')}catch(e){alert(text)}}
function goStart(){show('start')}
</script></body></html>
