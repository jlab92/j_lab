<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캠퍼제이 답방 매니저</title><style>*{box-sizing:border-box}html{min-width:420px;width:420px}body{width:420px;min-width:420px;max-height:560px;overflow:auto;margin:0;background:#f4f7f3;color:#20382c;font-family:system-ui,"Malgun Gothic",sans-serif;font-size:13px}header{background:#29553d;color:white;padding:19px}header small{color:#bfe1cb;letter-spacing:.12em}h1{margin:4px 0 2px;font-size:20px}header p{margin:0;color:#d9ecdf;font-size:12px}main{padding:14px}section{background:white;border:1px solid #e2eae2;border-radius:12px;padding:14px;margin-bottom:12px}label{display:block;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;border:1px solid #cfdbd1;padding:9px;border-radius:7px;font:inherit;color:#20382c}textarea{resize:vertical;min-height:65px}.row{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}button{border:1px solid #b9ceb9;color:#265840;background:white;border-radius:7px;padding:8px 10px;font-weight:700;cursor:pointer}button.primary{background:#2b6d49;border-color:#2b6d49;color:white}button:disabled{opacity:.6;cursor:wait}.muted{font-size:11px;color:#708274;line-height:1.5}#status{font-size:12px;min-height:16px;line-height:1.5;color:#225b40;margin-top:9px}.title{font-size:13px;font-weight:700;overflow-wrap:anywhere}#excerpt{font-size:11px;line-height:1.6;color:#6a786d;max-height:75px;overflow:auto;white-space:pre-wrap}#history{font-size:11px;line-height:1.5;color:#647365}a{color:#27734a}</style></head><body><header><small>CAMPER J</small><h1>답방 매니저</h1><p>현재 열어둔 게시글을 한 번에 읽고 댓글을 추천해요.</p></header><main><section><label for="url">게시글 주소 (자동 입력)</label><input id="url" placeholder="https://blog.naver.com/아이디/글번호"><div class="row"><button class="primary" id="auto">현재 글 자동 읽기</button><button id="load">주소로 불러오기</button><button id="open">원문 열기</button></div><div id="status" role="status" aria-live="polite"></div></section><section><div class="muted">확인된 글</div><div class="title" id="title">아직 불러온 글이 없어요.</div><div id="excerpt"></div><label for="tone">댓글 말투</label><select id="tone"><option value="friendly">친근한 말투</option><option value="plain">담백한 말투</option><option value="short">짧은 말투</option></select><label for="reply">댓글 초안 (직접 수정 가능)</label><textarea id="reply" placeholder="글을 불러오면 댓글이 제안됩니다."></textarea><div class="row"><button id="again">다른 문구</button><button class="primary" id="copy">복사하기</button><button id="save">답방 완료</button></div><p class="muted">기본 댓글은 무료 규칙 기반이며, AI 댓글 버튼은 별도 API를 사용합니다. 제안된 댓글이 실제 글 내용과 맞는지 확인 후 직접 등록하세요.</p></section><section style="background:#f6fbf6"><strong>AI 감상 댓글 생성</strong><p class="muted">글을 읽고 상황에 맞는 반응을 새로 작성합니다. OpenAI API 이용료가 별도로 발생하며, 공개 글의 본문이 API로 전송됩니다. 키는 이 브라우저 세션에만 저장할 수 있습니다.</p><label for="apiKey">OpenAI API 키</label><input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-..."><div class="row"><button class="primary" id="ai">AI 감상 댓글 작성</button><button id="clearKey">API 키 지우기</button></div></section><section><strong>최근 답방 기록</strong><div id="history">아직 기록이 없어요.</div></section></main><script src="popup.js"></script></body></html>
